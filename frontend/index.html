<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KinoCompass – подбор фильмов под ваш вкус по нескольким оценкам (MovieLens 32M)" />
    <meta name="theme-color" content="#0f0e13" />
    <title>KinoCompass – фильмы под ваш вкус</title>
    <!-- тема – до загрузки CSS и JS, иначе мелькнёт другая; по умолчанию тёмная («кинозал») -->
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem('kinocompass-theme') !== 'light'
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
